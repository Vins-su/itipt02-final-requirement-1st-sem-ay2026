<ion-content class="ion-padding auth-background">
  <div>
    
    <!-- App Logo / Branding -->
    <div>
      <div>
        <ion-icon name="person-add-outline"></ion-icon>
      </div>
      <h1>Create Account</h1>
      <p>NutriBantay - BHS Registration</p>
    </div>

    <!-- Register Form -->
    <form class="register-form">
      <div>
        <ion-input [(ngModel)]="registrationData.fullName" name="fullName" class="custom-input" label="Full Name" label-placement="floating" fill="solid" required></ion-input>

        <ion-input [(ngModel)]="registrationData.username" name="username" class="custom-input" label="Email or Username" label-placement="floating" fill="solid" required></ion-input>

        <ion-input [(ngModel)]="registrationData.password" name="password" class="custom-input" type="password" label="Password" label-placement="floating" fill="solid" required></ion-input>

        <ion-input [(ngModel)]="registrationData.confirmPassword" name="confirmPassword" class="custom-input" type="password" label="Confirm Password" label-placement="floating" fill="solid" required></ion-input>
      </div>

      <div>
        <ion-button type="submit" expand="block" shape="round" color="success" class="register-btn">
          <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
          Sign Up
        </ion-button>
        <ion-button type="button" expand="block" shape="round" fill="clear" color="medium" class="cancel-btn">
          Cancel
        </ion-button>
      </div>
    </form>

  </div>
</ion-content>
